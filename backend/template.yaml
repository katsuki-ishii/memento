AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Memento backend (SAM + Cognito + API Gateway + Lambda)

Parameters:
  ProjectName:
    Type: String
    Default: memento
  ApiStageName:
    Type: String
    Default: dev
  CognitoDomainPrefix:
    Type: String
    Default: memento-dev
  DynamoTableName:
    Type: String
    Default: memento-user-event-dev
  CallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/auth/callback
  LogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/auth/start
  CorsAllowOrigin:
    Type: String
    Default: http://localhost:5173

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      StageName: !Ref ApiStageName
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-health'
      CodeUri: .
      Handler: src/handlers/health.handler
      Environment:
        Variables:
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
      Events:
        ApiHealth:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  SettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-settings'
      CodeUri: .
      Handler: src/handlers/settings.handler
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_USER_POOL_CLIENT_ID: !Ref UserPoolClient
          COGNITO_USER_POOL_DOMAIN: !Sub '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
          COGNITO_USER_POOL_REGION: !Ref AWS::Region
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
          DDB_TABLE_NAME: !Ref UserEventTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserEventTable
      Events:
        SettingsGet:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /me/settings
            Method: GET
        SettingsPatch:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /me/settings
            Method: PATCH

  EventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-events'
      CodeUri: .
      Handler: src/handlers/events.handler
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_USER_POOL_CLIENT_ID: !Ref UserPoolClient
          COGNITO_USER_POOL_DOMAIN: !Sub '${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
          COGNITO_USER_POOL_REGION: !Ref AWS::Region
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
          DDB_TABLE_NAME: !Ref UserEventTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserEventTable
      Events:
        EventsGet:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /events
            Method: GET
        EventsPost:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /events
            Method: POST
        EventsPatch:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /events/{id}
            Method: PATCH
        EventsDelete:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /events/{id}
            Method: DELETE

  UserEventTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UserPoolDomain:
    Value: !Ref UserPoolDomain
  HostedUiBaseUrl:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  ApiBaseUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}'
  UserEventTableName:
    Value: !Ref UserEventTable
  UserEventTableArn:
    Value: !GetAtt UserEventTable.Arn
